# yaml-language-server: $schema=none
# Choreo Component Directory MUST be: docker-images/python-services
schemaVersion: "1.2"

endpoints:
  - name: analysis
    displayName: Python Analysis (HNDL Scorer)
    service:
      basePath: /
      port: 8082
    type: REST
    networkVisibilities:
      - Project

  - name: qasm
    displayName: QASM Examples Service
    service:
      basePath: /
      port: 8084
    type: REST
    networkVisibilities:
      - Project

configurations:
  env:
    - name: DATABASE_URL
      valueFrom:
        configForm:
          displayName: Database URL (AlwaysData PostgreSQL)
          type: secret
          required: true
