# yaml-language-server: $schema=none
# Choreo Component Directory MUST be: docker-images/python-services
schemaVersion: "1.2"

endpoints:
  - name: analysis
    displayName: Python Analysis (HNDL Scorer)
    service:
      basePath: /
      port: 8082
    type: REST
    schemaFilePath: openapi-analysis.yaml
    networkVisibilities:
      - Organization
      - Project

  - name: qasm
    displayName: QASM Examples Service
    service:
      basePath: /
      port: 8084
    type: REST
    schemaFilePath: openapi-qasm.yaml
    networkVisibilities:
      - Organization
      - Project
