worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # temp dirs writable by non-root user
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    access_log /var/log/nginx/access.log;
    sendfile   on;
    keepalive_timeout 65;

    # upstream hostnames can be overridden via env vars in Choreo
    # default values match docker-compose service names
    upstream go_services {
        server go-services:8080;
    }

    server {
        listen 8080;

        location /health {
            proxy_pass          http://go_services/health;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  10s;
        }

        location /api/v1/ {
            proxy_pass          http://go_services;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout  30s;
            proxy_connect_timeout 5s;
        }

        location / {
            proxy_pass          http://go_services;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
        }
    }
}
