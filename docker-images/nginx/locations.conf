# Shared location blocks — included by both the TLS and plain-HTTP server blocks

add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Max-Age       86400 always;

if ($request_method = OPTIONS) {
    return 204;
}

location = /health {
    default_type application/json;
    add_header Access-Control-Allow-Origin  $cors_origin always;
    return 200 '{"status":"ok","service":"nginx"}';
}

location = /health/gateway {
    proxy_pass         http://$go_backend/health;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location /api/v1/ {
    proxy_pass            http://$go_backend$request_uri;
    proxy_set_header      Host $host;
    proxy_set_header      X-Real-IP $remote_addr;
    proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    30s;
    proxy_connect_timeout 5s;
}

location / {
    proxy_pass         http://$go_backend$request_uri;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
