# yaml-language-server: $schema=none
# Choreo Component Directory MUST be: docker-images/nginx
schemaVersion: "1.2"

endpoints:
  - name: nginx-ingress
    displayName: PQC Digital Twin — Public API
    service:
      basePath: /
      port: 8080
    type: REST
    networkVisibilities:
      - Public

dependencies:
  connectionReferences:
    - name: go-gateway-connection
      resourceRef: service:/pqc-migration-digital-twin/go-services/v1.0/gateway/PROJECT

configurations:
  env:
    - name: GO_SERVICES_HOST
      valueFrom:
        connectionRef:
          name: go-gateway-connection
          key: ServiceURL
