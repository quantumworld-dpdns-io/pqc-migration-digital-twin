openapi: 3.0.3
info:
  title: Go Gateway (API Router)
  version: "1.0.0"
  description: PQC Digital Twin API gateway. Routes to discovery, analysis, risk and qasm services.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: OK }
  /api/v1/discovery:
    post:
      summary: Run a discovery scan
      responses:
        "200": { description: OK }
  /api/v1/assets:
    get:
      summary: List discovered assets
      responses:
        "200": { description: OK }
    post:
      summary: Create or upsert a manually supplied asset
      responses:
        "200": { description: Existing asset updated }
        "201": { description: Asset created }
        "400": { description: Invalid asset }
  /api/v1/risk:
    post:
      summary: Compute migration risk score
      responses:
        "200": { description: OK }
  /api/v1/risk/backlog:
    post:
      summary: Compute risk migration backlog
      responses:
        "200": { description: OK }
  /api/v1/proof:
    post:
      summary: Generate ZK migration proof
      responses:
        "200": { description: OK }
  /api/v1/qasm:
    post:
      summary: Run a QASM circuit example
      responses:
        "200": { description: OK }
  /api/v1/qasm/run:
    post:
      summary: Validate and run a named QASM example manifest
      responses:
        "200": { description: Validated }
        "400": { description: Invalid manifest }
