# yaml-language-server: $schema=none
# Choreo Component Directory MUST be: docker-images/go-services
#
# Manual env (DevOps → Configs & Secrets) OR Architecture Diagram connections:
#   PYTHON_BASE_URL, QASM_BASE_URL, RUST_BASE_URL, DATABASE_URL
#   DISCOVERY_BASE_URL = http://localhost:8081  (same container, optional)
schemaVersion: "1.2"

endpoints:
  - name: gateway
    displayName: Go Gateway (API Router)
    service:
      basePath: /
      port: 8080
    type: REST
    networkVisibilities:
      - Project

  - name: discovery
    displayName: Go Discovery (Asset Scanner)
    service:
      basePath: /
      port: 8081
    type: REST
    networkVisibilities:
      - Project
