apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-risk
  namespace: pqc-digital-twin
  labels:
    app.kubernetes.io/name: rust-risk
    app.kubernetes.io/part-of: pqc-migration-digital-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-risk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-risk
        app.kubernetes.io/part-of: pqc-migration-digital-twin
    spec:
      securityContext:
        runAsUser: 10014
        runAsGroup: 10014
      containers:
        - name: rust-risk
          image: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/rust-risk:latest
          ports:
            - containerPort: 8083
              name: risk-engine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pqc-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
