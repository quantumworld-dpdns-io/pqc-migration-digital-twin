apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pqc-digital-twin

resources:
  - 00-namespace.yaml
  # Apply 01-secret-template.yaml manually after filling in DATABASE_URL.
  - nginx/configmap.yaml
  - nginx/deployment.yaml
  - nginx/service.yaml
  - go-services/configmap.yaml
  - go-services/deployment.yaml
  - go-services/service.yaml
  - python-services/deployment.yaml
  - python-services/service.yaml
  - rust-risk/deployment.yaml
  - rust-risk/service.yaml

# Override image tags at deploy time:
#   kustomize edit set image \
#     ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/nginx=ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/nginx:SHA
images:
  - name: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/nginx
    newTag: latest
  - name: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/go-services
    newTag: latest
  - name: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/python-services
    newTag: latest
  - name: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/rust-risk
    newTag: latest

commonLabels:
  environment: dev
