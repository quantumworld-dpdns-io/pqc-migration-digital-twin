apiVersion: v1
kind: Service
metadata:
  name: python-services
  namespace: pqc-digital-twin
  labels:
    app.kubernetes.io/name: python-services
    app.kubernetes.io/part-of: pqc-migration-digital-twin
spec:
  selector:
    app.kubernetes.io/name: python-services
  ports:
    - name: analysis
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: qasm
      port: 8084
      targetPort: 8084
      protocol: TCP
  type: ClusterIP
