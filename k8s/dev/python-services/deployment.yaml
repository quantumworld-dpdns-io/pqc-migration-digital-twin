apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-services
  namespace: pqc-digital-twin
  labels:
    app.kubernetes.io/name: python-services
    app.kubernetes.io/part-of: pqc-migration-digital-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-services
        app.kubernetes.io/part-of: pqc-migration-digital-twin
    spec:
      securityContext:
        runAsUser: 10014
        runAsGroup: 10014
      containers:
        - name: python-services
          image: ghcr.io/quantumworld-dpdns-io/pqc-migration-digital-twin/python-services:latest
          ports:
            - containerPort: 8082
              name: analysis
            - containerPort: 8084
              name: qasm
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pqc-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
