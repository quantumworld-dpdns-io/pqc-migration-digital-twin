# Secret template — do NOT commit real values.
# Create the real secret with:
#   kubectl create secret generic pqc-db-secret \
#     --namespace pqc-digital-twin \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/db?sslmode=require' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# On Choreo: add DATABASE_URL under K8s Operations → Configs & Secrets
#            for each of: go-services, python-services, rust-risk.
apiVersion: v1
kind: Secret
metadata:
  name: pqc-db-secret
  namespace: pqc-digital-twin
  labels:
    app.kubernetes.io/part-of: pqc-migration-digital-twin
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
