name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts-validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local cert generation script
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-local-certs-script.sh

  lint:
    name: Lint (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, rust, python, node]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.lang }}" in
            go)
              if command -v gofmt >/dev/null 2>&1 && [ -d src/go ]; then
                files="$(find src/go -type f -name '*.go')"
                if [ -n "$files" ]; then
                  out="$(gofmt -l $files)"
                  if [ -n "$out" ]; then
                    echo "$out"
                    echo "[lint][go] gofmt check failed"
                    exit 1
                  fi
                  echo "[lint][go] gofmt check passed"
                else
                  echo "[lint][go] no Go files found; skipping"
                fi
              else
                echo "[lint][go] gofmt not available or src/go missing; skipping"
              fi
              ;;
            rust)
              if [ -f src/rust/Cargo.toml ]; then
                (cd src/rust && cargo fmt --all --check)
                (cd src/rust && cargo clippy --workspace --all-targets -- -D warnings)
              else
                echo "[lint][rust] src/rust/Cargo.toml missing; skipping"
              fi
              ;;
            python)
              python -m pip install --upgrade pip
              python -m pip install pytest
              ran=0
              for p in tests src/python/tests; do
                if [ -d "$p" ]; then
                  python -m compileall -q "$p"
                  ran=1
                fi
              done
              if [ "$ran" -eq 0 ]; then
                echo "[lint][python] tests/ and src/python/tests missing; skipping"
              fi
              ;;
            node)
              if [ -f src/web/package.json ]; then
                cd src/web
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
                npm run lint
              else
                echo "[lint][node] src/web/package.json missing; skipping"
              fi
              ;;
          esac

  test:
    name: Test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, rust, python, node]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.lang }}" in
            go)
              if [ -d src/go ]; then
                for modfile in src/go/*/go.mod; do
                  [ -f "$modfile" ] || continue
                  moddir="$(dirname "$modfile")"
                  (cd "$moddir" && go test ./...)
                done
              else
                echo "[test][go] src/go missing; skipping"
              fi
              ;;
            rust)
              if [ -f src/rust/Cargo.toml ]; then
                (cd src/rust && cargo test --workspace)
              else
                echo "[test][rust] src/rust/Cargo.toml missing; skipping"
              fi
              ;;
            python)
              python -m pip install --upgrade pip
              python -m pip install pytest
              if [ -d tests/contracts ]; then
                pytest -q tests/contracts
              else
                echo "[test][python] tests/contracts missing; skipping"
              fi
              if [ -d src/python/tests ]; then
                pytest -q src/python/tests
              else
                echo "[test][python] src/python/tests missing; skipping"
              fi
              ;;
            node)
              if [ -f src/web/package.json ]; then
                cd src/web
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
                if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
                  npm test -- --watch=false
                else
                  echo "[test][node] no test script defined; skipping"
                fi
              else
                echo "[test][node] src/web/package.json missing; skipping"
              fi
              ;;
          esac

  contracts:
    name: Contract Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contract smoke tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -d tests/contracts ]; then
            pytest -q tests/contracts
          else
            echo "[contracts] tests/contracts missing; skipping"
          fi
          if [ -d src/python/tests ]; then
            pytest -q src/python/tests
          else
            echo "[contracts] src/python/tests missing; skipping"
          fi

  security-readiness:
    name: Security Readiness (Phase 5 Gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rationale: enforce an actionable dependency vulnerability gate at PR time.
      # We scan the repository filesystem (lockfiles/manifests) and fail on High/Critical findings.
      - name: Dependency vulnerability gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      # Rationale: add a concrete container-image gate using a real service image.
      # Nginx edge image is fast to build and representative of deployable artifacts.
      - name: Build nginx service image for container scanning
        shell: bash
        run: |
          set -euo pipefail
          docker build -t pqc-nginx-security-scan:ci docker-images/nginx

      - name: Container vulnerability gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'image'
          image-ref: 'pqc-nginx-security-scan:ci'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      # Rationale: produce a lightweight, portable SBOM artifact for compliance evidence.
      # SPDX JSON from repository dependencies is sufficient for Phase 5 readiness baseline.
      - name: Generate repository SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-repo.spdx.json

      - name: Upload SBOM artifact for evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: phase5-sbom-spdx-json
          path: sbom-repo.spdx.json
          if-no-files-found: error

  dockerfile-build-evidence:
    name: Dockerfile Build Evidence (Consolidation Images)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            context: docker-images/nginx
            dockerfile: docker-images/nginx/Dockerfile
            tag: pqc-ci-nginx:evidence
          - image: go-services
            context: .
            dockerfile: docker-images/go-services/Dockerfile
            tag: pqc-ci-go-services:evidence
          - image: python-services
            context: .
            dockerfile: docker-images/python-services/Dockerfile
            tag: pqc-ci-python-services:evidence
          - image: rust-risk
            context: .
            dockerfile: docker-images/rust-risk/Dockerfile
            tag: pqc-ci-rust-risk:evidence
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }} image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.tag }}" \
            "${{ matrix.context }}"
      - name: Save build metadata artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          docker image inspect "${{ matrix.tag }}" > "ci-artifacts/${{ matrix.image }}-image-inspect.json"
      - name: Upload build evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-evidence-${{ matrix.image }}
          path: ci-artifacts/${{ matrix.image }}-image-inspect.json
          if-no-files-found: error

  checkov-dockerfiles:
    name: Checkov Dockerfile Scan (Consolidation Images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Checkov on consolidation Dockerfiles (fail on findings)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov
          checkov --framework dockerfile --quiet --file docker-images/nginx/Dockerfile
          checkov --framework dockerfile --quiet --file docker-images/go-services/Dockerfile
          checkov --framework dockerfile --quiet --file docker-images/python-services/Dockerfile
          checkov --framework dockerfile --quiet --file docker-images/rust-risk/Dockerfile

  integration-docker:
    name: Integration (Docker Microservices)
    runs-on: ubuntu-latest
    needs: [scripts-validation, lint, test, contracts, security-readiness, dockerfile-build-evidence, checkov-dockerfiles]
    steps:
      - uses: actions/checkout@v4
      - name: Docker microservice smoke test
        run: |
          bash tests/integration/docker_microservices_smoke.sh
