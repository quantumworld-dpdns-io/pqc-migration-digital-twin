services:
  # ── Local DB (dev only — not deployed to Choreo) ───────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pqc_digital_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Component 1: Nginx reverse proxy / entry point ─────────────────────────
  nginx:
    build:
      context: "docker images/nginx"
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      go-services:
        condition: service_healthy
      python-services:
        condition: service_healthy
      rust-risk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Component 2: Go gateway + discovery (merged) ───────────────────────────
  go-services:
    build:
      context: .
      dockerfile: "docker images/go-services/Dockerfile"
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # discovery runs in the same container — use localhost
      DISCOVERY_BASE_URL: http://localhost:8081
      PYTHON_BASE_URL: http://python-services:8082
      RUST_BASE_URL: http://rust-risk:8083
      QASM_BASE_URL: http://python-services:8084
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pqc_digital_twin?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Component 3: Python analysis + QASM examples (merged) ─────────────────
  python-services:
    build:
      context: .
      dockerfile: "docker images/python-services/Dockerfile"
    ports:
      - "8082:8082"
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pqc_digital_twin?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Component 4: Rust risk engine ──────────────────────────────────────────
  rust-risk:
    build:
      context: .
      dockerfile: "docker images/rust-risk/Dockerfile"
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pqc_digital_twin?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
