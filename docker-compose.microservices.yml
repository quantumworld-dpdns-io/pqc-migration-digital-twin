services:
  go-gateway:
    build:
      context: .
      dockerfile: src/go/gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      go-discovery:
        condition: service_healthy
      python-analysis:
        condition: service_healthy
      rust-risk:
        condition: service_healthy
      qasm-examples:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  go-discovery:
    build:
      context: .
      dockerfile: src/go/discovery/Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  python-analysis:
    build:
      context: .
      dockerfile: src/python/Dockerfile
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  rust-risk:
    build:
      context: .
      dockerfile: src/rust/Dockerfile
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  qasm-examples:
    build:
      context: .
      dockerfile: src/qasm/examples/Dockerfile
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
